name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test payload
        run: node tests/payload.test.js

      - name: Build
        shell: cmd
        run: build\build.cmd

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist\* -DestinationPath OutlookMeetJoin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OutlookMeetJoin
          path: OutlookMeetJoin.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OutlookMeetJoin.zip
